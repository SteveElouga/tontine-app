<div class="shell">
  <aside class="sidebar">
    <div class="brand"><i class="pi pi-users"></i><span>Tontine</span></div>
    <nav>
      @for (item of nav; track item.label) {
        @if (item.route) {
          <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
            <i [class]="item.icon"></i>{{ item.label }}
          </a>
        } @else {
          <span class="nav-item todo">
            <i [class]="item.icon"></i>{{ item.label }}
          </span>
        }
      }
    </nav>
    <div class="sidebar-bottom">
      @for (item of navBas; track item.label) {
        <span class="nav-item todo">
          <i [class]="item.icon"></i>{{ item.label }}<span class="soon-tag">bientôt</span>
        </span>
      }
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<p-toast position="top-right" />
